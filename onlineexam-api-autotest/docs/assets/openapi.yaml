openapi: 3.0.3
info:
  title: AI 在线考试与学情分析系统 API
  version: 1.0.0
  description: |-
    基于 Django + DRF 的在线考试平台接口文档。

    认证方式：先调用 `/api/v1/auth/login/` 获取 `access`，再在右上角 Authorize 中填入 `Bearer <access>`。
paths:
  /api/health/:
    get:
      operationId: api_health_retrieve
      description: |-
        GET /api/health/ —— 探活接口。

        部署后给负载均衡 / 监控系统用；也方便确认数据库连接是否正常。
      summary: 健康检查
      tags:
      - 系统
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/ai/chat/:
    post:
      operationId: api_v1_ai_chat_create
      description: 大模型能力的统一入口。
      summary: 在线调试大模型
      tags:
      - AI 能力
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIChatRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIChatRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIChatRequestRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIChatRequest'
          description: ''
  /api/v1/ai/logs/:
    get:
      operationId: api_v1_ai_logs_retrieve
      description: 大模型能力的统一入口。
      summary: 最近调用记录
      tags:
      - AI 能力
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIChatRequest'
          description: ''
  /api/v1/ai/providers/:
    get:
      operationId: api_v1_ai_providers_retrieve
      description: 大模型能力的统一入口。
      summary: 平台清单与配置状态
      tags:
      - AI 能力
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIChatRequest'
          description: ''
  /api/v1/ai/test-connection/:
    post:
      operationId: api_v1_ai_test_connection_create
      description: 大模型能力的统一入口。
      summary: 测试平台连通性
      tags:
      - AI 能力
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIChatRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIChatRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIChatRequestRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIChatRequest'
          description: ''
  /api/v1/ai/usage/:
    get:
      operationId: api_v1_ai_usage_retrieve
      description: 大模型能力的统一入口。
      summary: 调用用量统计
      tags:
      - AI 能力
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIChatRequest'
          description: ''
  /api/v1/analytics/exams/:
    get:
      operationId: api_v1_analytics_exams_retrieve
      description: 可分析的考试列表（有作答记录的考试）。
      summary: 可分析的考试列表
      tags:
      - 学情分析 · 教师
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/exams/{exam_id}/questions/:
    get:
      operationId: api_v1_analytics_exams_questions_retrieve
      description: 逐题得分率与区分度。
      summary: 逐题得分率与区分度
      parameters:
      - in: query
        name: classroom_id
        schema:
          type: integer
        description: 按班级过滤（可选）
      - in: path
        name: exam_id
        schema:
          type: integer
        required: true
      tags:
      - 学情分析 · 教师
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/exams/{exam_id}/report/:
    get:
      operationId: api_v1_analytics_exams_report_retrieve
      description: 班级学情总览：分数分布、参与度、行为概览、薄弱知识点、排名预览。
      summary: 班级学情总览
      parameters:
      - in: query
        name: classroom_id
        schema:
          type: integer
        description: 按班级过滤（可选）
      - in: path
        name: exam_id
        schema:
          type: integer
        required: true
      - in: query
        name: include_rows
        schema:
          type: boolean
        description: 是否附带逐人明细
      tags:
      - 学情分析 · 教师
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/students/{student_id}/diagnosis/:
    post:
      operationId: api_v1_analytics_students_diagnosis_create
      description: 生成 / 刷新 AI 学情诊断（命中缓存则不重复调用大模型）。
      summary: 生成 AI 学情诊断
      parameters:
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      tags:
      - 学情分析
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosisRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DiagnosisRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DiagnosisRequestRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/students/{student_id}/mastery/:
    get:
      operationId: api_v1_analytics_students_mastery_retrieve
      description: 知识点掌握度矩阵与薄弱点。
      summary: 知识点掌握度（含雷达图数据与薄弱点）
      parameters:
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      - in: query
        name: subject
        schema:
          type: string
        description: 按学科过滤
      tags:
      - 学情分析
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/students/{student_id}/report/:
    get:
      operationId: api_v1_analytics_students_report_retrieve
      description: |-
        个人学情总览（页面一次拿全）。

        **不会自动调大模型**——只返回已有的诊断缓存（若有）。
        要生成诊断请调 ``POST .../diagnosis/``。
      summary: 个人学情总览
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: 趋势取最近多少次作答
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      - in: query
        name: subject
        schema:
          type: string
        description: 按学科过滤
      tags:
      - 学情分析
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/students/{student_id}/trend/:
    get:
      operationId: api_v1_analytics_students_trend_retrieve
      description: 成绩趋势与线性回归预测。
      summary: 成绩趋势（含回归预测）
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: 取最近多少次作答
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      - in: query
        name: subject
        schema:
          type: string
        description: 按学科过滤
      tags:
      - 学情分析
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/attempts/:
    get:
      operationId: api_v1_attempts_list
      description: 作答记录：学生自己的作答全流程 + 教师的查阅。
      parameters:
      - name: ordering
        required: false
        in: query
        description: 用于排序结果的字段。
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: 每页返回的结果数量。
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: 搜索关键词。
        schema:
          type: string
      tags:
      - 考试 · 作答
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExamAttemptStudentList'
          description: ''
  /api/v1/attempts/{id}/:
    get:
      operationId: api_v1_attempts_retrieve
      description: 作答记录：学生自己的作答全流程 + 教师的查阅。
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - 考试 · 作答
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamAttemptStudent'
          description: ''
  /api/v1/attempts/{id}/answers/:
    get:
      operationId: api_v1_attempts_answers_retrieve
      description: 作答记录：学生自己的作答全流程 + 教师的查阅。
      summary: 逐题作答明细（GET 查看 / POST 批量暂存）
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - 考试 · 作答
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamAttempt'
          description: ''
    post:
      operationId: api_v1_attempts_answers_create
      description: 作答记录：学生自己的作答全流程 + 教师的查阅。
      summary: 逐题作答明细（GET 查看 / POST 批量暂存）
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - 考试 · 作答
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamAttemptRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExamAttemptRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExamAttemptRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamAttempt'
          description: ''
  /api/v1/attempts/{id}/behavior/:
    post:
      operationId: api_v1_attempts_behavior_create
      description: 作答记录：学生自己的作答全流程 + 教师的查阅。
      summary: 行为上报（切屏 / 粘贴 / 退出全屏）
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - 考试 · 作答
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BehaviorReportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BehaviorReportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BehaviorReportRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamAttempt'
          description: ''
  /api/v1/attempts/{id}/heartbeat/:
    post:
      operationId: api_v1_attempts_heartbeat_create
      description: 作答记录：学生自己的作答全流程 + 教师的查阅。
      summary: 心跳（返回服务端权威剩余时间）
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - 考试 · 作答
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamAttempt'
          description: ''
  /api/v1/attempts/{id}/paper/:
    get:
      operationId: api_v1_attempts_paper_retrieve
      description: 作答记录：学生自己的作答全流程 + 教师的查阅。
      summary: 获取卷面与已存答案（断网续考 / 刷新恢复）
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - 考试 · 作答
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamAttempt'
          description: ''
  /api/v1/attempts/{id}/result/:
    get:
      operationId: api_v1_attempts_result_retrieve
      description: 作答记录：学生自己的作答全流程 + 教师的查阅。
      summary: 查看结果
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - 考试 · 作答
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamAttemptStudent'
          description: ''
  /api/v1/attempts/{id}/save/:
    post:
      operationId: api_v1_attempts_save_create
      description: 作答记录：学生自己的作答全流程 + 教师的查阅。
      summary: 单题暂存
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - 考试 · 作答
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAnswerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaveAnswerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaveAnswerRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamAttempt'
          description: ''
  /api/v1/attempts/{id}/submit/:
    post:
      operationId: api_v1_attempts_submit_create
      description: 作答记录：学生自己的作答全流程 + 教师的查阅。
      summary: 交卷
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - 考试 · 作答
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamAttempt'
          description: ''
  /api/v1/auth/change-password/:
    post:
      operationId: api_v1_auth_change_password_create
      description: POST /api/v1/auth/change-password/
      summary: 修改密码
      tags:
      - 认证
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      description: POST /api/v1/auth/login/  → {access, refresh, user}
      summary: 登录（用户名 / 邮箱 / 学号）
      tags:
      - 认证
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenObtainPair'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
      description: 'POST /api/v1/auth/logout/  body: {refresh}'
      summary: 登出（refresh token 拉黑）
      tags:
      - 认证
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logout'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: api_v1_auth_me_list
      description: GET / PATCH / PUT /api/v1/auth/me/
      summary: 当前登录用户：查询 / 修改资料
      parameters:
      - name: ordering
        required: false
        in: query
        description: 用于排序结果的字段。
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: 每页返回的结果数量。
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: 搜索关键词。
        schema:
          type: string
      tags:
      - 认证
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    put:
      operationId: api_v1_auth_me_update
      description: GET / PATCH / PUT /api/v1/auth/me/
      summary: 当前登录用户：查询 / 修改资料
      tags:
      - 认证
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdate'
          description: ''
    patch:
      operationId: api_v1_auth_me_partial_update
      description: GET / PATCH / PUT /api/v1/auth/me/
      summary: 当前登录用户：查询 / 修改资料
      tags:
      - 认证
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdate'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: api_v1_auth_refresh_create
      description: 'POST /api/v1/auth/refresh/  body: {refresh}'
      summary: 刷新 access token
      tags:
      - 认证
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: api_v1_auth_register_create
      description: POST /api/v1/auth/register/
      summary: 用户注册
      tags:
      - 认证
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
          multipart/form-data:
            schema:
