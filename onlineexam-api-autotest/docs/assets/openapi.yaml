components:
  schemas:
    AIChatRequest:
      type: object
      description: |-
        调试接口入参。

        两种用法二选一：
          * 传 ``prompt`` —— 走某个业务场景的提示词模板（推荐，能验证真实链路）；
          * 传 ``messages`` —— 直接给一段对话，纯聊天调试。
      properties:
        prompt:
          type: string
          description: 用户输入内容
        system:
          type: string
          description: 系统提示词
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
          description: 自定义消息列表
        scene:
          type: string
          default: generic
          description: 业务场景标识
        variables:
          type: object
          additionalProperties: {}
          description: 场景提示词模板的占位符变量
        provider:
          type: string
          description: 临时指定平台
        json_mode:
          type: boolean
          default: false
        temperature:
          type: number
          format: double
          maximum: 2.0
          minimum: 0.0
          default: 0.7
        max_tokens:
          type: integer
          maximum: 32000
          minimum: 1
          nullable: true
    AIChatRequestRequest:
      type: object
      description: |-
        调试接口入参。

        两种用法二选一：
          * 传 ``prompt`` —— 走某个业务场景的提示词模板（推荐，能验证真实链路）；
          * 传 ``messages`` —— 直接给一段对话，纯聊天调试。
      properties:
        prompt:
          type: string
          description: 用户输入内容
        system:
          type: string
          description: 系统提示词
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessageRequest'
          description: 自定义消息列表
        scene:
          type: string
          minLength: 1
          default: generic
          description: 业务场景标识
        variables:
          type: object
          additionalProperties: {}
          description: 场景提示词模板的占位符变量
        provider:
          type: string
          description: 临时指定平台
        json_mode:
          type: boolean
          default: false
        temperature:
          type: number
          format: double
          maximum: 2.0
          minimum: 0.0
          default: 0.7
        max_tokens:
          type: integer
          maximum: 32000
          minimum: 1
          nullable: true
    AIGenerateRequestRequest:
      type: object
      description: AI 出题入参。
      properties:
        subject:
          type: string
          default: ''
        knowledge_points:
          type: array
          items:
            type: string
            minLength: 1
          description: 知识点名称列表
        knowledge_point_ids:
          type: array
          items:
            type: integer
          description: 也可以直接传知识点 id，会自动补出名称
        question_types:
          type: array
          items:
            $ref: '#/components/schemas/QuestionTypesEnum'
          default:
          - single
        difficulty:
          allOf:
          - $ref: '#/components/schemas/DifficultyEnum'
          default: 2
        count:
          type: integer
          maximum: 20
          minimum: 1
          default: 5
        source_text:
          type: string
          default: ''
          description: 教材段落 / 命题素材
        provider:
          type: string
          default: ''
    ActionEnum:
      enum:
      - accept
      - adjust
      - override
      type: string
      description: |-
        * `accept` - 直接采纳建议分
        * `adjust` - 在建议分基础上调整
        * `override` - 完全自评
    AddQuestionsRequest:
      type: object
      description: 往卷子里加题。
      properties:
        question_ids:
          type: array
          items:
            type: integer
          minItems: 1
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        strict:
          type: boolean
          default: true
          description: True=遇到已在卷内的题直接报错；False=静默跳过（AI 组卷用）
      required:
      - question_ids
    AddStudentsRequest:
      type: object
      description: |-
        添加学生：按 id / 按学号 / 从行政班整班导入（三者至少提供一个）。

        ``from_classroom_id`` 只做「是不是整数」的形状校验；「是不是启用的行政班」
        由视图查库判断（那里的错误是 400 业务提示，比字段级报错更贴近用户操作）。
      properties:
        student_ids:
          type: array
          items:
            type: integer
        student_nos:
          type: array
          items:
            type: string
            minLength: 1
        from_classroom_id:
          type: integer
          nullable: true
    AdminUser:
      type: object
      description: |-
        管理员操作用户的序列化器：可以改角色、学科与启用状态。

        ``subject``（任教学科）由管理端维护（U-1）：教师账号可绑定学科，
        候选人列表来自 ``overview.options.subjects``，但字段本身是自由文本（Q-4）。
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: 用户名
          description: 必填；长度为150个字符或以下；只能包含字母、数字、特殊字符“@”、“.”、“-”和“_”。
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: 邮箱
          maxLength: 254
        real_name:
          type: string
          title: 真实姓名
          maxLength: 32
        role:
          allOf:
          - $ref: '#/components/schemas/Role273Enum'
          title: 角色
        role_display:
          type: string
          readOnly: true
        phone:
          type: string
          title: 手机号
          maxLength: 20
        student_no:
          type: string
          title: 学号 / 工号
          description: 学生填学号，教师填工号；唯一性在序列化器里校验
          maxLength: 32
        school:
          type: string
          title: 学校 / 院系
          maxLength: 64
        subject:
          type: string
          title: 任教学科
          description: 教师专属：只管理该学科的资源（题库/试卷/考试）；留空表示不限学科
          maxLength: 64
        avatar:
          type: string
          format: uri
          nullable: true
          title: 头像
        is_active:
          type: boolean
          title: 有效
          description: 指明用户是否被认为是活跃的。以反选代替删除帐号。
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: 加入日期
      required:
      - date_joined
      - email
      - id
      - role_display
      - username
    AdminUserRequest:
      type: object
      description: |-
        管理员操作用户的序列化器：可以改角色、学科与启用状态。

        ``subject``（任教学科）由管理端维护（U-1）：教师账号可绑定学科，
        候选人列表来自 ``overview.options.subjects``，但字段本身是自由文本（Q-4）。
      properties:
        username:
          type: string
          minLength: 1
          title: 用户名
          description: 必填；长度为150个字符或以下；只能包含字母、数字、特殊字符“@”、“.”、“-”和“_”。
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          title: 邮箱
          maxLength: 254
        real_name:
          type: string
          title: 真实姓名
          maxLength: 32
        role:
          allOf:
          - $ref: '#/components/schemas/Role273Enum'
          title: 角色
        phone:
          type: string
          title: 手机号
          maxLength: 20
        student_no:
          type: string
          title: 学号 / 工号
          description: 学生填学号，教师填工号；唯一性在序列化器里校验
          maxLength: 32
        school:
          type: string
          title: 学校 / 院系
          maxLength: 64
        subject:
          type: string
          title: 任教学科
          description: 教师专属：只管理该学科的资源（题库/试卷/考试）；留空表示不限学科
          maxLength: 64
        avatar:
          type: string
          format: binary
          nullable: true
          title: 头像
        is_active:
          type: boolean
          title: 有效
          description: 指明用户是否被认为是活跃的。以反选代替删除帐号。
      required:
      - email
      - username
    AnswerItemRequest:
      type: object
      description: 一道题的作答内容。
      properties:
        paper_question_id:
          type: integer
        selected_labels:
          type: string
          maxLength: 32
        answer_text:
          type: string
        is_flagged:
          type: boolean
        time_spent_seconds:
          type: integer
          maximum: 86400
          minimum: 0
      required:
      - paper_question_id
    AnswerReviewRequest:
      type: object
      description: |-
        教师复核一道题。

        两种用法互斥但都支持：
          * ``accept_ai=true`` —— 一键采纳 AI 建议分；
          * 给 ``score``      —— 教师自己定分。
      properties:
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
          description: 复核后的分数；accept_ai=true 时忽略
        comment:
          type: string
          default: ''
          description: 教师评语，会覆盖原评语
        accept_ai:
          type: boolean
          default: false
        action:
          nullable: true
          description: |-
            处置方式；不传则按有无 AI 建议自动判定

            * `accept` - 直接采纳建议分
            * `adjust` - 在建议分基础上调整
            * `override` - 完全自评
          oneOf:
          - $ref: '#/components/schemas/ActionEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
    AttemptFinalizeRequest:
      type: object
      description: 出分（目前无需参数，留出结构以便将来加「通知学生」等开关）。
      properties:
        notify:
          type: boolean
          default: false
    AttemptGradeRequest:
      type: object
      description: 判分入参。
      properties:
        with_ai:
          type: boolean
          default: false
          description: 是否同时调用大模型批改主观题（会消耗 token，默认关闭）
        policy:
          nullable: true
          description: |-
            多选题给分策略；不传则用考试自己的配置

            * `strict` - 严格：全对才得分
            * `partial` - 漏选给部分分，错选不得分
            * `penalty` - 漏选给部分分，错选倒扣
          oneOf:
          - $ref: '#/components/schemas/PolicyEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        provider:
          type: string
          nullable: true
          description: 指定 AI 平台（deepseek / doubao / openai / mock）；不传用项目默认
          maxLength: 32
        force:
          type: boolean
          default: false
          description: 已出分的作答是否允许重新判分（默认拒绝，避免覆盖人工复核结果）
    BatchScoreRequest:
      type: object
      description: 批量调分。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemRequest'
      required:
      - items
    BehaviorEventRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/BehaviorEventTypeEnum'
        count:
          type: integer
          maximum: 100
          minimum: 1
          default: 1
        detail:
          type: string
          maxLength: 200
      required:
      - type
    BehaviorEventTypeEnum:
      enum:
      - switch
      - paste
      - fullscreen_exit
      - blur
      - heartbeat
      type: string
      description: |-
        * `switch` - 切屏/离开页面
        * `paste` - 粘贴
        * `fullscreen_exit` - 退出全屏
        * `blur` - 窗口失焦
