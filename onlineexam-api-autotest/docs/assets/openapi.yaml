        name: has_ai
        schema:
          type: boolean
        description: 只看 AI 生成
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_reviewed
        schema:
          type: boolean
      - in: query
        name: keyword
        schema:
          type: string
        description: 关键字
      - in: query
        name: knowledge_point
        schema:
          type: number
        description: 知识点（含子知识点）
      - in: query
        name: knowledge_point_exact
        schema:
          type: integer
        description: 知识点（精确匹配）
      - name: ordering
        required: false
        in: query
        description: 用于排序结果的字段。
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: 每页返回的结果数量。
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: 搜索关键词。
        schema:
          type: string
      - in: query
        name: source
        schema:
          type: string
          title: 来源
          enum:
          - ai
          - import
          - manual
        description: |-
          * `manual` - 手动录入
          * `ai` - AI 生成
          * `import` - 批量导入
      - in: query
        name: subject
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
          title: 题型
          enum:
          - essay
          - fill
          - judge
          - multiple
          - short
          - single
        description: |-
