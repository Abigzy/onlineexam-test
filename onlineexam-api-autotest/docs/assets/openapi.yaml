    RandomComposeRequestRequest:
      type: object
      description: 随机组卷入参：只选知识点 + 题量，蓝图由系统按题库库存自动生成，不调 AI。
      properties:
        title:
          type: string
          maxLength: 200
        subject:
          type: string
          maxLength: 64
        knowledge_point_ids:
          type: array
          items:
            type: integer
          description: 要覆盖的知识点（自动包含其子知识点）；不传表示全题库范围
        total_count:
          type: integer
          maximum: 200
          minimum: 1
          default: 20
          description: 期望题量；蓝图会按题库库存自动分配题型，实际可能因库存不足而少于该值
        target_difficulty:
          type: number
          format: double
          maximum: 4.0
          minimum: 1.0
          default: 2.0
        duration_minutes:
          type: integer
          maximum: 600
          minimum: 1
          default: 90
        pass_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        exclude_ids:
          type: array
          items:
            type: integer
          description: 要排除的题目 id（如刚考过的题）
        seed:
          type: integer
          nullable: true
          description: 随机种子；传相同值可复现同一份卷子
        dry_run:
          type: boolean
          default: false
    ReasonEnum:
      enum:
      - manual
      - timeout
      - forced
      - system
      type: string
      description: |-
        * `manual` - 学生主动交卷
        * `timeout` - 超时自动交卷
        * `forced` - 违规强制交卷
        * `system` - 系统代交
    RemoveQuestionsRequest:
      type: object
      description: |-
        把题目移出试卷。

        传的是 ``paper_question.id``（卷内条目 id）而**不是** ``question.id``：
        同一道题理论上可以出现在不同卷子里，按卷内条目定位才不会误删别的卷子。
      properties:
        ids:
          type: array
          items:
            type: integer
          description: 卷内题目条目 id（PaperQuestion.id）
          minItems: 1
      required:
      - ids
    ReorderRequest:
      type: object
      description: 调整题目顺序。
      properties:
        ordered_ids:
          type: array
          items:
            type: integer
          minItems: 1
      required:
      - ordered_ids
    Role273Enum:
      enum:
      - admin
      - teacher
      - student
      type: string
      description: |-
        * `admin` - 管理员
        * `teacher` - 教师
        * `student` - 学生
    SaveAnswerRequest:
      type: object
      description: 单题暂存（和批量共用一个结构，少定义一份契约）。
      properties:
        paper_question_id:
          type: integer
        selected_labels:
          type: string
          maxLength: 32
        answer_text:
          type: string
        is_flagged:
          type: boolean
        time_spent_seconds:
          type: integer
          maximum: 86400
          minimum: 0
      required:
      - paper_question_id
    Source8adEnum:
      enum:
      - manual
      - ai
      - import
      type: string
      description: |-
        * `manual` - 手动录入
        * `ai` - AI 生成
        * `import` - 批量导入
    StartExamRequest:
      type: object
      description: 开考。目前没有必填参数，留出结构以便将来加「确认考前须知」等开关。
      properties:
        confirm:
          type: boolean
          default: true
    Status158Enum:
      enum:
      - draft
      - published
      - archived
      type: string
      description: |-
        * `draft` - 草稿
        * `published` - 已发布
        * `archived` - 已归档
    StatusA96Enum:
      enum:
      - draft
      - published
      - ongoing
      - finished
      - archived
      type: string
      description: |-
        * `draft` - 草稿
        * `published` - 已发布
        * `ongoing` - 进行中
        * `finished` - 已结束
        * `archived` - 已归档
    StatusC3fEnum:
      enum:
      - in_progress
      - submitted
      - auto_graded
      - reviewing
      - graded
      - timeout
      type: string
      description: |-
        * `in_progress` - 答题中
        * `submitted` - 已交卷
        * `auto_graded` - 自动判分完成
        * `reviewing` - 待人工复核
        * `graded` - 已出分
        * `timeout` - 超时交卷
    StatusChangeRequest:
      type: object
      description: 状态流转。
      properties:
        status:
          $ref: '#/components/schemas/Status158Enum'
      required:
      - status
    SubmitReasonEnum:
      enum:
      - manual
      - timeout
      - forced
      - system
      type: string
      description: |-
        * `manual` - 学生主动交卷
        * `timeout` - 超时自动交卷
        * `forced` - 违规强制交卷
        * `system` - 系统代交
    SubmitRequest:
      type: object
      description: |-
        交卷。

        ``reason`` 只作为「学生自述」记录下来，最终以服务端判定的超时与否为准。
        ``items`` 让前端在交卷的同一次请求里带上最后一批作答——「点了交卷但最后一题
        没存上」是很常见的丢分事故，多带一个字段就能彻底避免。
      properties:
        reason:
          allOf:
          - $ref: '#/components/schemas/ReasonEnum'
          default: manual
        items:
          type: array
          items:
            $ref: '#/components/schemas/AnswerItemRequest'
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    Type611Enum:
      enum:
      - single
      - multiple
      - judge
      - fill
      - short
      - essay
      type: string
      description: |-
        * `single` - 单选题
        * `multiple` - 多选题
        * `judge` - 判断题
        * `fill` - 填空题
        * `short` - 简答题
        * `essay` - 论述题
    User:
      type: object
      description: 用户公开信息（用于返回给前端渲染）。
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: 用户名
          description: 必填；长度为150个字符或以下；只能包含字母、数字、特殊字符“@”、“.”、“-”和“_”。
        email:
          type: string
          format: email
          title: 邮箱
          maxLength: 254
        real_name:
          type: string
          title: 真实姓名
          maxLength: 32
        display_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/Role273Enum'
          readOnly: true
          title: 角色
        role_display:
          type: string
          readOnly: true
        phone:
          type: string
          title: 手机号
          maxLength: 20
        student_no:
          type: string
          title: 学号 / 工号
          description: 学生填学号，教师填工号；唯一性在序列化器里校验
          maxLength: 32
        school:
          type: string
          title: 学校 / 院系
          maxLength: 64
        subject:
          type: string
          readOnly: true
          title: 任教学科
          description: 教师专属：只管理该学科的资源（题库/试卷/考试）；留空表示不限学科
        avatar:
          type: string
          format: uri
          nullable: true
          title: 头像
        avatar_url:
          type: string
          description: 返回可直接放进 <img src> 的绝对地址。
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: 有效
          description: 指明用户是否被认为是活跃的。以反选代替删除帐号。
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: 上次登录
        last_login_ip:
          type: string
          readOnly: true
          nullable: true
          title: 最后登录 IP
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: 加入日期
      required:
      - avatar_url
      - date_joined
      - display_name
      - email
      - id
      - is_active
      - last_login
      - last_login_ip
      - role
      - role_display
      - subject
      - username
    UserRegister:
      type: object
      description: |-
        注册。密码做二次确认 + Django 内置强度校验。

        学号 / 工号**不接收客户端输入**（管理员建号走 ``AdminUserSerializer``）：
        学生按所选年级由系统派发学号，教师账号注册入口本就不开放。
      properties:
        username:
          type: string
          title: 用户名
          description: 必填；长度为150个字符或以下；只能包含字母、数字、特殊字符“@”、“.”、“-”和“_”。
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: 邮箱
          maxLength: 254
        role:
          allOf:
          - $ref: '#/components/schemas/UserRegisterRoleEnum'
          default: student
        real_name:
          type: string
          title: 真实姓名
          maxLength: 32
        phone:
          type: string
          title: 手机号
          maxLength: 20
        school:
          type: string
          title: 学校 / 院系
          maxLength: 64
      required:
      - email
      - username
    UserRegisterRequest:
      type: object
      description: |-
        注册。密码做二次确认 + Django 内置强度校验。

        学号 / 工号**不接收客户端输入**（管理员建号走 ``AdminUserSerializer``）：
        学生按所选年级由系统派发学号，教师账号注册入口本就不开放。
      properties:
        username:
          type: string
          minLength: 1
          title: 用户名
          description: 必填；长度为150个字符或以下；只能包含字母、数字、特殊字符“@”、“.”、“-”和“_”。
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          title: 邮箱
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 6
        password2:
          type: string
          writeOnly: true
          minLength: 1
          title: 确认密码
        role:
          allOf:
          - $ref: '#/components/schemas/UserRegisterRoleEnum'
          default: student
        real_name:
          type: string
          title: 真实姓名
          maxLength: 32
        grade_year:
          type: string
          writeOnly: true
          minLength: 1
          title: 入学年级
          description: 4 位年份（如 2026）；系统据此派发学号
        phone:
          type: string
          title: 手机号
          maxLength: 20
        school:
          type: string
          title: 学校 / 院系
          maxLength: 64
      required:
      - email
      - grade_year
      - password
      - password2
      - username
    UserRegisterRoleEnum:
      enum:
      - student
      type: string
      description: '* `student` - student'
    UserRequest:
      type: object
      description: 用户公开信息（用于返回给前端渲染）。
      properties:
        email:
          type: string
          format: email
          minLength: 1
          title: 邮箱
          maxLength: 254
        real_name:
          type: string
          title: 真实姓名
          maxLength: 32
        phone:
          type: string
          title: 手机号
          maxLength: 20
        student_no:
          type: string
          title: 学号 / 工号
          description: 学生填学号，教师填工号；唯一性在序列化器里校验
          maxLength: 32
        school:
          type: string
          title: 学校 / 院系
          maxLength: 64
        avatar:
          type: string
          format: binary
          nullable: true
          title: 头像
      required:
      - email
    UserUpdate:
      type: object
      description: |-
        用户自助修改资料（不允许改角色、用户名、学号/工号）。

        学号 / 工号由系统派发，是身份标识，自助修改意味着可以冒用别人的号。
      properties:
        email:
          type: string
          format: email
          title: 邮箱
          maxLength: 254
        real_name:
          type: string
          title: 真实姓名
          maxLength: 32
        phone:
          type: string
          title: 手机号
          maxLength: 20
        school:
          type: string
          title: 学校 / 院系
          maxLength: 64
        avatar:
          type: string
          format: uri
          nullable: true
          title: 头像
      required:
      - email
    UserUpdateRequest:
      type: object
      description: |-
        用户自助修改资料（不允许改角色、用户名、学号/工号）。

        学号 / 工号由系统派发，是身份标识，自助修改意味着可以冒用别人的号。
      properties:
        email:
          type: string
          format: email
          minLength: 1
          title: 邮箱
          maxLength: 254
        real_name:
          type: string
          title: 真实姓名
          maxLength: 32
        phone:
          type: string
          title: 手机号
          maxLength: 20
        school:
          type: string
          title: 学校 / 院系
          maxLength: 64
        avatar:
          type: string
          format: binary
          nullable: true
          title: 头像
      required:
      - email
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
