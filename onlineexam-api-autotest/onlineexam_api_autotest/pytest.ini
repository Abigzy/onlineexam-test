[pytest]
testpaths = scripts
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 默认排除 slow（限流用例会污染同一分钟的 auth 作用域）
# 单独跑限流：pytest scripts/test_b12_ratelimit.py -m slow
addopts = -s --html=report/report.html --self-contained-html -ra --strict-markers --tb=short -m "not slow"
markers =
    l0: 冒烟层（环境与主链路可用性）
    l1: 单接口业务规则
    l2: 场景串联
    l3: 数据一致性与幂等
    l4: 权限与安全横切
    slow: 慢用例（限流、长链路），默认不跑
filterwarnings =
    ignore::DeprecationWarning
