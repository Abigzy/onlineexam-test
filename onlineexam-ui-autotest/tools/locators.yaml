# OnlineExam UI 自动化 · 定位器清单（唯一事实来源）
# 由 tools/probe_locators.py 在真实浏览器里逐条实测，结果写入 tools/locator_report.json
#
# 字段：
#   id       页面标识（与步骤 5 的 Page 类一一对应）
#   role     student / teacher / admin（决定用哪个会话打开）
#   path     页面路径，{id} 由 ids 段替换
#   cases    该页涉及的用例编号（便于回溯）
#   wait     进入页面后等待的"业务节点"（不是 body，不是 document.readyState）
#   locators 定位器列表：name 中文名 / css 选择器 / min 期望最少命中数 / text 期望首元素文本包含 / note 备注
#
# 纪律：
#   1. 只允许 CSS_SELECTOR；禁止绝对 XPath、禁止 nth-child 绑业务语义
#   2. min: 0 表示"结构上应存在但内容依赖造数"，步骤 6 用 UIAT 数据复测时才要求 ≥1
#   3. 任何定位器命中数低于 min，probe 直接判 FAIL，不允许"先跑起来再说"

version: 1
base_url: http://127.0.0.1:8931
accounts:
  student: { username: student, password: Exam@123456 }
  teacher: { username: teacher, password: Exam@123456 }
  admin:   { username: admin,   password: Exam@123456 }
ids:
  # 演示库当前数据（2026-11-04 读取；数据变了只改这里，不改断言）
  student_exam_graded: 34     # student 已批改作答所属考试
  teacher_exam: 466           # 有作答的考试（监控/成绩单/证据链）
  teacher_attempt: 586        # 该考试下的一份作答
  teacher_paper: 11           # 有题目的试卷（34 题）
  teacher_question: 2419      # 任一题目
  student_classroom: 32       # student 所在班级
  student_id: 3               # student 用户 id

pages:
  # ---------------------------------------------------------------- 学生
  - id: student-home
    role: student
    path: /
    cases: [UI-AUTH-01, UI-SEC-05]
    wait: ".navbar-brand"
    locators:
      - { name: 顶部品牌, css: "a.navbar-brand", min: 1 }
      - { name: 主导航容器, css: "#mainNav", min: 1 }
      - { name: 统计卡（登录态）, css: ".stat-card", min: 1, note: ".stat-chip/.feature-card 只在未登录落地页" }
      - { name: 统计值, css: ".stat-value", min: 1 }
      - { name: 用户下拉, css: "#mainNav .nav-item.dropdown", min: 1 }

  - id: student-my-exams
    role: student
    path: /my-exams/
    cases: [UI-EXAM-01, UI-EXAM-02, UI-EXAM-15, UI-EXAM-16, UI-EXAM-19]
    wait: "#exam-cards"
    locators:
      - { name: 卡片容器, css: "#exam-cards", min: 1 }
      - { name: 页签, css: "#tabs button[data-tab]", min: 3 }
      - { name: 刷新按钮, css: "#btn-refresh", min: 1 }
      - { name: 考试卡片, css: "#exam-cards .card", min: 0, note: "数据依赖；造数后应 ≥1" }
      - { name: 状态徽章, css: "#exam-cards .badge-soft", min: 0 }
      - { name: 开始考试按钮, css: "#exam-cards .act-start", min: 0 }

  - id: student-take
    role: student
    path: /exams/{student_exam_graded}/take/
    cases: [UI-EXAM-03, UI-EXAM-04, UI-EXAM-05, UI-EXAM-06, UI-EXAM-11, UI-EXAM-12, UI-EXAM-14, UI-EXAM-21, UI-EXAM-22]
    wait: "#exam-body"
    locators:
      - { name: 答题页主体, css: "#exam-body", min: 1 }
      - { name: 加载占位, css: "#loading-box", min: 1 }
      - { name: 题目宿主, css: "#question-host", min: 1 }
      - { name: 计时器, css: "#timer", min: 1 }
      - { name: 进度文本, css: "#progress-text", min: 1 }
      - { name: 答题卡, css: "#q-sheet", min: 1 }
      - { name: 答题卡格子, css: "#q-sheet .q-cell", min: 0, note: "仅正常作答态有" }
      - { name: 保存状态, css: "#save-flag", min: 1 }
      - { name: 交卷按钮, css: "#btn-submit", min: 1 }
      - { name: 标记按钮, css: "#btn-flag", min: 1 }
      - { name: 上一题, css: "#btn-prev", min: 1 }
      - { name: 下一题, css: "#btn-next", min: 1 }
