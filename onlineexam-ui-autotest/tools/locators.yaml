      - { name: 弹窗内按钮, css: "#submitModal button", min: 2 }
      - { name: 确认交卷, css: "#btn-confirm-submit", min: 1 }
      - { name: 题目块, css: "#question-host .question-block", min: 0 }
      - { name: 选项行, css: "#question-host .option-row", min: 0 }
