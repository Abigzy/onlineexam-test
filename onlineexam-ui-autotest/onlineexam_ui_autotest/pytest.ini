[pytest]
testpaths = scripts
python_files = test_*.py
; 报告：跑完自动生成，**默认开启**（每轮多约 6~12s）。直接 `pytest` 就有最新报告。
;     临时关掉：OE_AUTO_REPORT=0 pytest -q       手工补生成：python tools/gen_report.py
;     （下面的 --clean-alluredir 每次启动都会清空 results，不自动生成就一定是旧报告）
addopts = -v -p no:randomly --alluredir=report/allure-results --clean-alluredir
filterwarnings =
    ignore::DeprecationWarning
markers =
    smoke: L0 冒烟子集（15 条，≤3min，失败即阻断提测）
    p0: 主链路「能通」，每次提交跑
    p1: 主链路细节、数据一致性，每次提测跑
    p2: 边界、空态、校验，版本级跑
    slow: 依赖等待或外部服务的用例，默认不跑（-m "not slow"）
